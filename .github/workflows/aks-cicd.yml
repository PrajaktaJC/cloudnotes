name: Build Push and Deploy to AKS

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: ACR Login
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Image
      run: |
        docker build -t cloudnotes:${{ github.sha }} .

    - name: Tag Image
      run: |
        docker tag cloudnotes:${{ github.sha }} \
        acrcloudnotespraju.azurecr.io/cloudnotes:${{ github.sha }}

    - name: Push Image
      run: |
        docker push \
        acrcloudnotespraju.azurecr.io/cloudnotes:${{ github.sha }}

    - name: Setup Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

    - name: Update AKS Deployment
      run: |
        kubectl set image deployment/cloudnotes \
        cloudnotes=acrcloudnotespraju.azurecr.io/cloudnotes:${{ github.sha }} \
        -n cloudnotes

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/cloudnotes -n cloudnotes