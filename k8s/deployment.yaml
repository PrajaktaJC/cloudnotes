apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudnotes
  namespace: cloudnotes

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudnotes

  template:
    metadata:
      labels:
        app: cloudnotes

    spec:
      containers:
      - name: cloudnotes

        image: acrcloudnotespraju.azurecr.io/cloudnotes:v1

        ports:
        - containerPort: 8000

        env:
      - name: DB_PASSWORD
        valueFrom:
        secretKeyRef:
          name: cloudnotes-secret
          key: DB_PASSWORD

        resources:
          requests:
              cpu: "100m"
              memory: "128Mi"
        
          limits:
              cpu: "250m"
              memory: "256Mi"