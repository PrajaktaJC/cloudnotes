apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudnotes
  namespace: cloudnotes

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudnotes

  template:
    metadata:
      labels:
        app: cloudnotes

    spec:
      containers:
      - name: cloudnotes

        image: acrcloudnotespraju.azurecr.io/cloudnotes:v1

        ports:
        - containerPort: 8000